name: Autobahn

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
  - cron: '0 10 * * 1' # run "At 10:00 on Monday"
  workflow_dispatch:   # enable manual runs

concurrency:
  group: autobahn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # The two jobs are independent diagnostics: a failure in one must not
      # cancel the other before it uploads its own report.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        go: [ 'stable', 'oldstable' ]

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        check-latest: true

    - name: Autobahn
      id: autobahn
      env:
        CRYPTOGRAPHY_ALLOW_OPENSSL_102: yes
      run: |
        make test autobahn

    - name: Autobahn Report Artifact
      # Keep the report, with the wire log of every case, only when the suite
      # failed: that is the only time anyone reads it. The failure() call is
      # required: an if without a status function is implicitly wrapped in
      # success() and would never run after a failed step.
      if: failure() && steps.autobahn.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: autobahn report ${{ matrix.go }} ${{ matrix.os }}
        path: autobahn/report
        retention-days: 7
